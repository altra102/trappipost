<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrappiPost – dein E-Mail-Programm zum Üben</title>
<style>
:root {
  --himmel: #dcebff;
  --himmel-tief: #c5dcfb;
  --papier: #ffffff;
  --papier-2: #f5f9ff;
  --tinte: #1f2a55;
  --tinte-2: #5a6690;
  --linie: #d5e1f5;
  --gelb: #ffc53d;
  --gelb-tief: #f0a800;
  --blau: #3d6df2;
  --gruen: #2e9e6b;
  --rot: #e0474c;
  --rund: 18px;
  --schrift: "Nunito", "Quicksand", ui-rounded, "SF Pro Rounded", "Segoe UI", "Cantarell", system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--schrift); font-size: 17px; color: var(--tinte);
  background: var(--himmel);
  background-image: radial-gradient(circle at 12% 0%, #eef5ff 0, transparent 40%), radial-gradient(circle at 100% 100%, #cfe2ff 0, transparent 45%);
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--blau); outline-offset: 2px; }
svg.ic { width: 1.25em; height: 1.25em; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ——— Rahmen ——— */
.app-innen { height: 100%; display: grid; grid-template-rows: auto 1fr; padding: 12px 14px 14px; gap: 12px; }
.kopf { display: flex; align-items: center; gap: 14px; padding: 2px 6px; }
.marke { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.45rem; letter-spacing: .01em; }
.marke svg { width: 58px; height: 41px; }
.kopf .luft { flex: 1; }
.meine { background: var(--papier); border-radius: 999px; padding: 6px 14px 6px 8px; display: flex; align-items: center; gap: 8px; font-size: .95rem; box-shadow: 0 1px 0 var(--himmel-tief); }
.meine b { font-weight: 800; }
.knopf-leise { border: 0; background: transparent; color: var(--tinte-2); padding: 8px 10px; border-radius: 12px; display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
.knopf-leise:hover { background: rgba(255,255,255,.6); color: var(--tinte); }

.haupt { display: grid; grid-template-columns: 250px minmax(270px, 340px) 1fr; gap: 12px; min-height: 0; }
.spalte { background: var(--papier); border-radius: var(--rund); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.seite { background: transparent; gap: 12px; overflow: visible; }

/* ——— Seitenleiste ——— */
.neu { border: 0; background: var(--gelb); border-radius: 16px; padding: 14px 18px; font-weight: 800; font-size: 1.1rem; display: flex; align-items: center; gap: 10px; box-shadow: 0 3px 0 var(--gelb-tief); }
.neu:hover { filter: brightness(1.03); }
.neu:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--gelb-tief); }
.ordner { background: var(--papier); border-radius: var(--rund); padding: 8px; display: flex; flex-direction: column; gap: 2px; }
.ordner button { border: 0; background: transparent; display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px; font-weight: 700; text-align: left; }
.ordner button:hover { background: var(--papier-2); }
.ordner button[aria-current="true"] { background: var(--himmel); }
.ordner .zahl { margin-left: auto; min-width: 26px; text-align: center; border-radius: 999px; font-size: .85rem; padding: 1px 8px; color: var(--tinte-2); }
.ordner .zahl.neu-da { background: var(--blau); color: #fff; }
.o-eingang svg { color: var(--blau); } .o-entwuerfe svg { color: #d97706; } .o-gesendet svg { color: #7a5af5; } .o-archiv svg { color: var(--gruen); } .o-papierkorb svg { color: var(--rot); }

/* Postkarte mit dem Auftrag */
.karte { position: relative; background: #fffdf6; border-radius: var(--rund); padding: 16px 16px 14px; flex: 1; min-height: 0; overflow: auto;
  background-image: repeating-linear-gradient(135deg, transparent 0 10px, rgba(61,109,242,.05) 10px 20px); background-size: 100% 6px; background-repeat: no-repeat;
  box-shadow: inset 0 0 0 2px #f3e6bf; }
.karte .briefmarke { position: absolute; top: 12px; right: 12px; }
.karte .wer { color: var(--tinte-2); font-weight: 700; font-size: .9rem; margin: 2px 76px 6px 0; }
.karte h2 { font-size: 1.2rem; line-height: 1.3; margin: 0 72px 10px 0; }
.karte .tipp { color: var(--tinte-2); font-size: .95rem; line-height: 1.4; margin: 0 0 10px; }
.punkte { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
.punkte i { width: 16px; height: 16px; border-radius: 50%; background: var(--linie); }
.punkte i.ok { background: var(--gruen); }
.punkte i.jetzt { background: var(--gelb); box-shadow: 0 0 0 3px #ffe7a3; }
.rueck { border-radius: 12px; padding: 10px 12px; font-size: .95rem; line-height: 1.4; margin-top: 10px; }
.rueck.fehlt { background: #fff1f1; box-shadow: inset 0 0 0 2px #f6c9cb; }
.rueck.fehlt ul { margin: 6px 0 0; padding-left: 20px; }
.rueck.gut { background: #eaf8f1; box-shadow: inset 0 0 0 2px #bfe6d2; font-weight: 700; }

.spielstand { display: flex; align-items: center; gap: 10px; margin: 2px 0 10px; font-weight: 800; }
.herzen { display: flex; gap: 3px; }
.herzen svg { width: 22px; height: 22px; }
.spielstand, .uhr, .sek { margin-right: 76px; }
.uhr { height: 12px; border-radius: 999px; background: var(--linie); overflow: hidden; margin: 4px 0 4px; }
.uhr i { display: block; height: 100%; background: var(--gruen); border-radius: 999px; transition: width .25s linear; }
.uhr.knapp i { background: var(--rot); }
.sek { font-weight: 800; color: var(--tinte-2); font-size: .95rem; }
.sek.knapp { color: var(--rot); }
/* Briefmarke (Absender-Bild) */
.briefmarke { --c: var(--blau); width: 48px; height: 48px; flex: none; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 1.05rem;
  background: var(--c); border-radius: 8px; outline: 3px dotted rgba(255,255,255,.9); outline-offset: -5px; box-shadow: 0 0 0 2px var(--c); }
.briefmarke.gross { width: 58px; height: 58px; font-size: 1.25rem; }
.stempel { width: 64px; height: 64px; font-size: .95rem; line-height: 1.05; text-align: center; color: var(--tinte); }
.stempel svg.ic { width: 30px; height: 30px; stroke-width: 3; }
.stempel.knall { animation: knall .6s cubic-bezier(.2,1.6,.4,1); }
@keyframes knall { 0% { transform: scale(1) rotate(0); } 40% { transform: scale(1.35) rotate(-12deg); } 100% { transform: scale(1) rotate(0); } }

/* ——— Liste ——— */
.listenkopf { padding: 16px 18px 10px; display: flex; align-items: baseline; gap: 10px; border-bottom: 2px solid var(--papier-2); }
.listenkopf h1 { margin: 0; font-size: 1.35rem; }
.listenkopf span { color: var(--tinte-2); font-weight: 700; }
.liste { overflow: auto; flex: 1; padding: 6px; }
.eintrag { width: 100%; border: 0; background: transparent; display: grid; grid-template-columns: 48px 1fr auto; gap: 4px 12px; align-items: center; text-align: left; padding: 12px; border-radius: 14px; position: relative; }
.eintrag:hover { background: var(--papier-2); }
.eintrag[aria-current="true"] { background: var(--himmel); }
.eintrag .briefmarke { grid-row: span 2; }
.eintrag .von { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.eintrag .zeit { color: var(--tinte-2); font-size: .85rem; }
.eintrag .betreff { grid-column: 2 / 4; color: var(--tinte-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: .95rem; }
.eintrag.ungelesen .von, .eintrag.ungelesen .betreff { font-weight: 800; color: var(--tinte); }
.eintrag.ungelesen::before { content: ""; position: absolute; left: 3px; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%; background: var(--blau); }
.eintrag.frisch { animation: rein .5s ease-out; }
@keyframes rein { from { transform: translateX(-16px); opacity: 0; } to { transform: none; opacity: 1; } }
.leer { text-align: center; color: var(--tinte-2); padding: 48px 24px; line-height: 1.5; }
.leer svg { width: 56px; height: 56px; stroke-width: 1.5; color: var(--himmel-tief); display: block; margin: 0 auto 10px; }

/* ——— Lesen und Schreiben ——— */
.werkzeug { display: flex; gap: 8px; padding: 12px 14px; border-bottom: 2px solid var(--papier-2); flex-wrap: wrap; }
.wk { border: 0; background: var(--papier-2); border-radius: 12px; padding: 10px 14px; display: inline-flex; align-items: center; gap: 8px; font-weight: 700; }
.wk:hover { background: var(--himmel); }
.wk.gruen { color: var(--gruen); } .wk.rot { color: var(--rot); } .wk.blau { color: var(--blau); }
.wk.gelb { background: var(--gelb); box-shadow: 0 3px 0 var(--gelb-tief); }
.wk.gelb:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--gelb-tief); }
.lesen { overflow: auto; flex: 1; padding: 22px 28px; }
.lesen h2 { margin: 0 0 16px; font-size: 1.45rem; line-height: 1.25; }
.absender { display: flex; gap: 14px; align-items: center; margin-bottom: 20px; }
.absender .n { font-weight: 800; }
.absender .a { color: var(--tinte-2); font-size: .92rem; }
.text { white-space: pre-wrap; line-height: 1.6; max-width: 62ch; font-size: 1.05rem; }
.text .alt { color: var(--tinte-2); }
.nichts { flex: 1; display: grid; place-items: center; text-align: center; color: var(--tinte-2); padding: 24px; }
.nichts svg { width: 120px; height: 120px; margin-bottom: 8px; }

.schreiben { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 8px 22px 18px; gap: 4px; }
.feld { display: grid; grid-template-columns: 84px 1fr auto; align-items: center; gap: 10px; border-bottom: 2px solid var(--papier-2); padding: 6px 0; }
.feld label { font-weight: 800; color: var(--tinte-2); }
.feld input { border: 0; background: transparent; padding: 10px 4px; font-size: 1.05rem; min-width: 0; }
.feld input:focus { outline: none; }
.feld:focus-within { border-bottom-color: var(--blau); }
.schreiben textarea { flex: 1; border: 0; resize: none; padding: 14px 4px; line-height: 1.6; font-size: 1.05rem; min-height: 180px; }
.schreiben textarea:focus { outline: none; }
.hinweis { background: #fff6dc; border-radius: 12px; padding: 10px 14px; font-weight: 700; margin: 6px 0; }

/* Adressbuch */
.adressbuch { position: absolute; z-index: 5; right: 0; top: calc(100% + 6px); width: min(420px, 90vw); background: var(--papier); border-radius: 16px; box-shadow: 0 12px 40px rgba(31,42,85,.2); padding: 8px; }
.adressbuch button { width: 100%; border: 0; background: transparent; display: flex; gap: 12px; align-items: center; padding: 8px 10px; border-radius: 12px; text-align: left; }
.adressbuch button:hover { background: var(--papier-2); }
.adressbuch .briefmarke { width: 38px; height: 38px; font-size: .9rem; }
.adressbuch small { display: block; color: var(--tinte-2); }

/* Toast und Start */
.toast { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--tinte); color: #fff; padding: 12px 20px; border-radius: 999px; font-weight: 700; display: flex; gap: 10px; align-items: center; box-shadow: 0 8px 24px rgba(31,42,85,.3); z-index: 20; animation: hoch .3s ease-out; }
@keyframes hoch { from { transform: translate(-50%, 20px); opacity: 0; } }
.schleier { position: absolute; inset: 0; background: rgba(31,42,85,.35); display: grid; place-items: center; z-index: 30; padding: 20px; }
.dialog { background: var(--papier); border-radius: 26px; padding: 30px 34px; width: min(520px, 100%); box-shadow: 0 24px 60px rgba(31,42,85,.3); }
.dialog h1 { margin: 6px 0 8px; font-size: 1.8rem; }
.dialog p { line-height: 1.5; color: var(--tinte-2); margin: 0 0 16px; }
.dialog input { width: 100%; border: 2px solid var(--linie); border-radius: 14px; padding: 12px 14px; font-size: 1.2rem; }
.dialog input:focus { outline: none; border-color: var(--blau); }
.dialog .zeile { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.dialog .adr { margin-top: 10px; font-weight: 700; color: var(--tinte); min-height: 1.4em; }
.dialog ul { line-height: 1.7; margin: 0 0 8px; padding-left: 22px; }

/* ——— Szene: feste Bühne 1600 × 1000, eingepasst; Kamera zoomt an den Bildschirm ——— */
body { overflow: hidden; background: #cdeee0; }
.szene { position: relative; height: 100vh; overflow: hidden; }
.buehne { position: absolute; left: 0; top: 0; width: 1600px; height: 1000px; transform-origin: 0 0; }
.kamera { position: absolute; inset: 0; transform-origin: 0 0; transition: transform .75s cubic-bezier(.3,.7,.2,1); will-change: transform; }
#welt { position: absolute; left: 0; top: 0; width: 1600px; height: 1000px; overflow: visible; }
#welt .kopf { fill: url(#kappe); stroke: #c3cad6; stroke-width: 1; }
#welt .seite { fill: #aeb6c4; }
#welt .taste { transition: transform .06s; }
#welt .taste.an { transform: translateY(3px); }
#welt .taste.an .kopf { fill: var(--gelb); stroke: var(--gelb-tief); }
#welt text { font-family: var(--schrift); fill: var(--tinte); font-weight: 800; pointer-events: none; }
#welt text.klein { fill: var(--tinte-2); font-weight: 700; }
#welt text.altgr { fill: var(--blau); }
#welt .pad { fill: url(#pad); stroke: #c3cad6; transition: fill .1s; }
#welt .pad.an { fill: #ffe9a8; }
.app { position: absolute; transform-origin: 0 0; border-radius: 6px; overflow: hidden; animation: an .9s ease-out;
  background: var(--himmel); background-image: radial-gradient(circle at 12% 0%, #eef5ff 0, transparent 40%), radial-gradient(circle at 100% 100%, #cfe2ff 0, transparent 45%); }
@keyframes an { from { filter: brightness(.3); } to { filter: none; } }
.zettel { position: absolute; left: 1392px; top: 262px; width: 168px; z-index: 3; padding: 16px 14px 16px; background: #fff27a; color: #3b3200; font-weight: 800; font-size: 19px; line-height: 1.35;
  transform: rotate(4deg); box-shadow: 0 10px 16px rgba(40,70,55,.25); border-radius: 2px 2px 14px 2px; pointer-events: none; }
.zettel::before { content: ""; position: absolute; top: -8px; left: 50%; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #e0474c; box-shadow: 0 2px 3px rgba(0,0,0,.3); }
.zettel b { display: block; font-size: 15px; margin-bottom: 4px; color: #8a6d00; }
.zoom { position: fixed; z-index: 50; bottom: 14px; right: 14px; border: 0; background: var(--papier); color: var(--tinte); border-radius: 999px; padding: 10px 16px; font-weight: 800; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 14px rgba(31,42,85,.18); }
.zoom:hover { background: var(--gelb); }
@media (max-width: 980px) { .haupt { grid-template-columns: 1fr; } .spalte { min-height: 300px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="szene" id="szene">
<div class="buehne" id="buehne"><div class="kamera" id="kamera">
  <svg id="welt" viewBox="0 0 1600 1000" aria-hidden="true"></svg>
  <div class="zettel" aria-hidden="true"><b>Nicht vergessen!</b>An · Betreff<br>Anrede<br>Text<br>Gruß + Name</div>
  <div class="app" id="app"><div class="app-innen">
  <header class="kopf">
    <div class="marke" aria-label="TrappiPost">
      <svg viewBox="0 0 80 56" aria-hidden="true" id="logo"></svg>
      TrappiPost
    </div>
    <div class="luft"></div>
    <div class="meine" id="meine"></div>
    <button class="knopf-leise" id="vonvorn" title="Alles zurücksetzen">
      <svg class="ic" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg> Von vorn
    </button>
  </header>

  <main class="haupt">
    <aside class="spalte seite">
      <button class="neu" id="neuKnopf"><svg class="ic" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg> Neue E-Mail</button>
      <nav class="ordner" id="ordner" aria-label="Ordner"></nav>
      <section class="karte" id="karte" aria-live="polite"></section>
    </aside>
    <section class="spalte" aria-label="E-Mails">
      <div class="listenkopf"><h1 id="listTitel"></h1><span id="listZahl"></span></div>
      <div class="liste" id="liste"></div>
    </section>
    <section class="spalte" id="rechts" aria-label="Lesen und Schreiben"></section>
  </main>
</div></div>
</div></div>
<button class="zoom" id="zoom" type="button"></button>
</div>


<script>
'use strict';
// Der Trappi-Wagen als Postwagen (Farben wie in Trappi: Rumpf #f4a72c, Deck #ffd07a, Kranbasis #33384a, Gelenk #f4c542)
const WAGEN_SVG = `
  <path d="M2 53h76" stroke="#8a93a6" stroke-width="3" stroke-linecap="round"/>
  <rect x="8" y="16" width="16" height="3.5" rx="1" fill="#fff" stroke="#1f2a55" stroke-width="1.6"/>
  <rect x="9" y="12.5" width="16" height="3.5" rx="1" fill="#fff" stroke="#1f2a55" stroke-width="1.6"/>
  <rect x="5" y="21" width="68" height="4" rx="1.5" fill="#ffd07a" stroke="#1f2a55" stroke-width="2"/>
  <rect x="4" y="24" width="70" height="20" rx="4" fill="#f4a72c" stroke="#1f2a55" stroke-width="2.5"/>
  <rect x="28" y="28" width="18" height="12" rx="1.5" fill="#fff" stroke="#1f2a55" stroke-width="2"/>
  <path d="M28.5 28.5l8.5 6 8.5-6" fill="none" stroke="#1f2a55" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="18" cy="46" r="6.5" fill="#24262f"/><circle cx="18" cy="46" r="2.2" fill="#8a93a6"/>
  <circle cx="60" cy="46" r="6.5" fill="#24262f"/><circle cx="60" cy="46" r="2.2" fill="#8a93a6"/>
  <path d="M52 21a7 6 0 0 1 14 0z" fill="#33384a" stroke="#1f2a55" stroke-width="2"/>
  <path d="M59 16L44 5" stroke="#1f2a55" stroke-width="7" stroke-linecap="round"/>
  <path d="M59 16L44 5" stroke="#e2e7ee" stroke-width="4" stroke-linecap="round"/>
  <circle cx="59" cy="16" r="3.3" fill="#f4c542" stroke="#1f2a55" stroke-width="1.6"/>
  <path d="M44 5v6" stroke="#454b59" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="38" y="10.5" width="12" height="8" rx="1" fill="#fff" stroke="#1f2a55" stroke-width="1.8" transform="rotate(-8 44 14.5)"/>
  <path d="M38.5 11l5.5 4 5.5-4" fill="none" stroke="#1f2a55" stroke-width="1.5" transform="rotate(-8 44 14.5)"/>`;

// ——— Symbole ———
const IC = {
  entwuerfe: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"/><path d="M14 3v6h6"/><path d="m9 16 5-5 2 2-5 5H9Z"/>',
  speichern: '<path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2Z"/><path d="M8 3v5h7V3"/><rect x="8" y="13" width="8" height="6" rx="1"/>',
  eingang: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6Z"/>',
  gesendet: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  archiv: '<rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/>',
  papierkorb: '<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  antworten: '<path d="M9 17 4 12l5-5"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/>',
  weiter: '<path d="m15 17 5-5-5-5"/><path d="M4 18v-2a4 4 0 0 1 4-4h12"/>',
  zurueck: '<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>',
  buch: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5Z"/><path d="M4 19.5V21h16"/><circle cx="12" cy="9" r="2.5"/><path d="M8.5 14c.8-1.6 2-2.3 3.5-2.3s2.7.7 3.5 2.3"/>',
  senden: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  weg: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  haken: '<path d="M20 6 9 17l-5-5"/>',
  post: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
};
const ic = (n) => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;

// ——— Menschen im Adressbuch (alle erfunden) ———
const KONTAKTE = [
  { name: 'Frau Sonne', rolle: 'deine Klassenlehrerin', adr: 'sonne@schule-am-see.de', farbe: '#f59e0b', kurz: 'FS' },
  { name: 'Tom', rolle: 'dein Freund', adr: 'tom@trappipost.de', farbe: '#3d6df2', kurz: 'T' },

// ——— Prüfhilfen ———
const klein = (t) => t.toLowerCase();
const eigen = (m) => { const t = m.text; const i = Math.min(...[t.indexOf(MARKE_ALT), t.indexOf(MARKE_WG)].map(x => x < 0 ? Infinity : x)); return (i === Infinity ? t : t.slice(0, i)).trim(); };
const zeilen = (t) => t.split('\n').map(z => z.trim()).filter(Boolean);
const hatAnrede = (m) => /^(hallo|hi|hey|liebe|lieber|sehr geehrte|sehr geehrter|guten tag|guten morgen|moin|servus)\b/i.test(zeilen(eigen(m))[0] || '');
const hatGruss = (m) => zeilen(eigen(m)).slice(-3).some(z => /(gr(ü|ue)(ß|ss)|tsch(ü|ue)ss|bis bald|bis dann|bis morgen|bis samstag|bis später|\blg\b|\bmfg\b|ciao|bye)/i.test(z));
const hatName = (m) => zeilen(eigen(m)).slice(-2).some(z => klein(z).includes(klein(S.name)));
const enthaelt = (m, ...woerter) => woerter.some(w => klein(eigen(m)).includes(klein(w)));
function form(m, fehlt, anredeName) {
  if (!hatAnrede(m)) fehlt.push(`Fang mit einer Anrede an, zum Beispiel „Hallo ${anredeName || 'Tom'},“.`);
  else if (anredeName && !klein(zeilen(eigen(m))[0]).includes(klein(anredeName.split(' ').pop()))) fehlt.push(`Sprich ${anredeName} in der Anrede mit Namen an.`);
  if (!hatGruss(m)) fehlt.push('Hör mit einem Gruß auf, zum Beispiel „Viele Grüße“.');
  if (!hatName(m)) fehlt.push(`Schreib unter den Gruß deinen Namen: ${S.name}.`);
}

function neueEndlosAufgabe() {

  let typ = imEingang >= 7 ? 'leer' : zufall(['antwort', 'antwort', 'antwort', 'neu', 'neu', 'weiter', 'weiter', 'loeschen', 'archiv', 'zurueck', 'entwurf']);
  if (typ === S.endlos.letzter && typ !== 'antwort') typ = 'antwort';
  const ohneVorlage = typ === 'leer' || typ === 'entwurf';
  let v = ohneVorlage ? {} : zufall(VORLAGEN[typ])(S);
  let tries = 0;
  while (!ohneVorlage && S.endlos.titel && v.titel === S.endlos.titel && tries++ < 5) v = zufall(VORLAGEN[typ])(S);
  const spec = { typ, id, an: v.an, woerter: v.woerter || [], anrede: v.anrede, frage: !!v.frage };
  const mails = [];
  if (typ === 'antwort') { spec.titel = v.titel; spec.tipp = `Öffne die E-Mail „${v.betreff}“. Klick auf „Antworten“.`; mails.push({ id, von: v.von, betreff: v.betreff, text: v.text }); }

  if (typ === 'loeschen') { spec.titel = `Lösch die Werbung „${v.betreff}“.`; spec.tipp = 'Öffne die E-Mail. Klick auf „Löschen“.'; mails.push({ id, von: v.von, betreff: v.betreff, text: v.text }); }

  if (typ === 'entwurf') { const p = zufall(KONTAKTE); spec.an = p.adr; spec.titel = `Fang eine E-Mail an ${p.name} an. Schreib nur den Betreff und speichere sie als Entwurf.`; spec.tipp = 'Klick beim Schreiben auf „Als Entwurf speichern“.'; }
  if (typ === 'leer') { spec.titel = 'Dein Posteingang ist voll. Räum auf, bis er leer ist.'; spec.tipp = 'Was erledigt ist: archivieren. Was du nicht brauchst: löschen.'; }
  const grund = { antwort: 90, neu: 100, weiter: 75, loeschen: 20, archiv: 20, zurueck: 25, leer: 45, entwurf: 40 }[typ];
  spec.sekunden = Math.round(grund * Math.max(0.6, 1 - 0.03 * S.endlos.punkte));
  spec.bis = Date.now() + spec.sekunden * 1000;
  S.endlos.letzter = typ; S.endlos.titel = spec.titel;

}
function pruefeEndlos(sp, e) {
  const pruefeText = (m, fehlt) => {
    sp.woerter.forEach(w => { if (!enthaelt(m, ...w.alts)) fehlt.push(w.hinweis); });
    if (sp.frage && !eigen(m).includes('?')) fehlt.push('Eine Frage braucht ein Fragezeichen: ?');
  };
  if (sp.typ === 'loeschen') return e.typ === 'verschoben' && e.mail.id === sp.id && e.nach === 'papierkorb';
  if (sp.typ === 'archiv') return e.typ === 'verschoben' && e.mail.id === sp.id && e.nach === 'archiv';
  if (sp.typ === 'zurueck') return e.typ === 'verschoben' && e.mail.id === sp.id && e.nach === 'eingang';
  if (sp.typ === 'leer') return S.mails.every(m => m.ordner !== 'eingang');
  if (sp.typ === 'entwurf') {
    if (e.typ !== 'entwurf') return false;
    const fehlt = [];
    if (e.mail.an !== sp.an) fehlt.push(`Trag die Adresse ein: ${sp.an}`);
    if (e.mail.betreff === '(ohne Betreff)') fehlt.push('Schreib einen Betreff.');
    return fehlt.length ? { fehlt } : true;
  }
  if (e.typ !== 'gesendet') return false;
  const m = e.mail, fehlt = [];
  if (sp.typ === 'antwort') {
    if (!(m.art === 'antwort' && m.bezug === sp.id)) fehlt.push('Antworte auf die richtige E-Mail: Öffne sie und klick auf „Antworten“.');
    pruefeText(m, fehlt); form(m, fehlt, sp.anrede);
  } else if (sp.typ === 'neu') {
    if (m.an !== sp.an) fehlt.push(`Die E-Mail muss an diese Adresse gehen: ${sp.an}`);
    pruefeText(m, fehlt); form(m, fehlt, sp.anrede);
  } else if (sp.typ === 'weiter') {
    if (!(m.art === 'weiter' && m.bezug === sp.id)) fehlt.push('Leite die richtige E-Mail weiter: Öffne sie und klick auf „Weiterleiten“.');
    if (m.an !== sp.an) fehlt.push(`Die E-Mail muss an ${sp.wem} gehen: ${sp.an}`);
    if (eigen(m).split(/\s+/).filter(Boolean).length < 3) fehlt.push(`Schreib über die weitergeleitete E-Mail einen Satz an ${sp.wem}.`);
  }
  return fehlt.length ? { fehlt } : true;
}

// ——— Zustand ———
const KEY = 'trappipost-v1';
let S = null;           // gespeicherter Zustand
let ansicht = { ordner: 'eingang', offen: null, schreiben: null, hinweis: '', buch: false };
let frisch = new Set();
function speichern() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function laden() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
const jetzt = () => new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
const esc = (t) => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function adresseAus(name) {
  return klein(name).trim().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss').replace(/\s+/g, '.').replace(/[^a-z0-9.-]/g, '') + '@trappipost.de';
}

// ——— Ereignisse und Aufträge ———
function melde(e) {
  const endlos = S.auftrag >= AUFTRAEGE.length;
  if (endlos && !(S.endlos && S.endlos.spec && S.endlos.laeuft)) return;
  const r = endlos ? pruefeEndlos(S.endlos.spec, e) : AUFTRAEGE[S.auftrag].check(e);
  if (r === true) {
    S.rueck = null;
    if (endlos) { S.endlos.nr++; S.endlos.punkte++; S.endlos.rekord = Math.max(S.endlos.rekord, S.endlos.punkte); S.endlos.spec = null; } else S.auftrag++;
    speichern(); render(); stempel();
    toast(`${ic('haken')} ${endlos ? 'Aufgabe' : 'Auftrag'} geschafft!`);
    setTimeout(starteAuftrag, 1100);
  } else if (r && r.fehlt) {
    S.rueck = r.fehlt; speichern(); render();
  }
}
function starteAuftrag() {
  const a = AUFTRAEGE[S.auftrag];
  if (!a) {
    if (!S.endlos) { S.endlos = { nr: 1, spec: null, punkte: 0, herzen: 3, rekord: 0, laeuft: false }; speichern(); render(); fertigDialog(); return; }
    if (!S.endlos.laeuft) { render(); return; }
    if (!S.endlos.spec) {
      const { spec, mails } = neueEndlosAufgabe();
      S.endlos.spec = spec;
      mails.forEach(m => { S.mails.unshift({ ordner: 'eingang', gelesen: false, ...m, zeit: jetzt() }); frisch.add(m.id); });
      if (mails.some(m => m.ordner !== 'papierkorb')) toast(`${ic('post')} Neue E-Mail im Posteingang`);
    }
    speichern(); render(); return;
  }
  if (a.neu && !S.gestartet.includes(S.auftrag)) {
    a.neu(S).forEach(m => { S.mails.unshift({ ...m, ordner: 'eingang', zeit: jetzt(), gelesen: false }); frisch.add(m.id); });
    S.gestartet.push(S.auftrag);
    toast(`${ic('post')} Neue E-Mail im Posteingang`);
  }
  speichern(); render();
}

// ——— Spiel auf Zeit ———
function tick() {
  const E = S && S.endlos;
  if (!E || !E.laeuft || !E.spec || document.querySelector('.schleier')) return;
  const rest = Math.max(0, E.spec.bis - Date.now());
  const uhr = document.getElementById('uhr'), sek = document.getElementById('sek');
  if (uhr) { const knapp = rest < 15000; uhr.classList.toggle('knapp', knapp); uhr.firstElementChild.style.width = (100 * rest / (E.spec.sekunden * 1000)) + '%'; sek.textContent = Math.ceil(rest / 1000) + ' s'; sek.classList.toggle('knapp', knapp); }
  if (rest > 0) return;
  E.herzen--; E.spec = null; S.rueck = null; speichern();
  if (E.herzen <= 0) { E.laeuft = false; speichern(); render(); vorbeiDialog(); return; }
  toast(`${herz(false)} Zu langsam! Ein Herz ist weg.`);
  render(); setTimeout(starteAuftrag, 900);
}
setInterval(tick, 250);
function herz(voll) { return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.6 3.3 5 6.8 5c2 0 3.5 1.1 5.2 3 1.7-1.9 3.2-3 5.2-3 3.5 0 5.6 3.6 4.3 6.8C19.5 16.4 12 21 12 21Z" fill="${voll ? '#e0474c' : 'none'}" stroke="${voll ? '#e0474c' : '#c9d4ea'}" stroke-width="2"/></svg>`; }
function neueRunde() {
  S.mails = S.mails.filter(m => !/^e\d/.test(m.id) && !/^post/.test(m.id));
  Object.assign(S.endlos, { nr: 1, spec: null, punkte: 0, herzen: 3, laeuft: true, letzter: null, titel: null });
  S.rueck = null; ansicht.offen = null; ansicht.schreiben = null; speichern(); starteAuftrag();
}
function vorbeiDialog() {
  const E = S.endlos;
  const d = document.createElement('div'); d.className = 'schleier';
  d.innerHTML = `<div class="dialog"><span class="briefmarke stempel knall" style="--c:var(--rot);color:#fff">${ic('weg')}</span>
    <h1>Keine Herzen mehr!</h1>
    <p>Du hast <b>${E.punkte}</b> ${E.punkte === 1 ? 'Aufgabe' : 'Aufgaben'} geschafft. Dein Rekord: <b>${E.rekord}</b>.</p>
    <div class="zeile"><button class="neu" id="nochmal">${ic('zurueck')} Nochmal</button></div></div>`;
  document.getElementById('app').appendChild(d);
  d.querySelector('#nochmal').addEventListener('click', () => { d.remove(); neueRunde(); });
}

// ——— Aktionen ———
function oeffne(id) {
  const m = S.mails.find(x => x.id === id);
  if (m.ordner === 'entwuerfe') {
    ansicht.schreiben = { art: m.art || 'neu', bezug: m.bezug || null, an: m.an, betreff: m.betreff, text: m.text, entwurf: m.id };
    ansicht.offen = null; ansicht.hinweis = ''; ansicht.buch = false; render();

  }

  render(); melde({ typ: 'geoeffnet', mail: m });
}
function verschiebe(id, nach) {
  const m = S.mails.find(x => x.id === id);
  m.ordner = nach; ansicht.offen = null; speichern();
  const wort = { archiv: 'Archiviert', papierkorb: 'In den Papierkorb gelegt', eingang: 'Zurück im Posteingang' }[nach];
  toast(`${ic(nach === 'eingang' ? 'zurueck' : nach)} ${wort}`);

}

  const b = bezugId && S.mails.find(x => x.id === bezugId);
  let an = '', betreff = '', text = '';
  if (art === 'antwort') {
    const p = person(b.von);
    an = b.von; betreff = 'AW: ' + b.betreff.replace(/^(AW|WG):\s*/i, '');

  } else if (art === 'weiter') {
    const p = person(b.von);
    betreff = 'WG: ' + b.betreff.replace(/^(AW|WG):\s*/i, '');
    text = `\n\n\n${MARKE_WG}\nVon: ${p ? p.name : ''} <${b.von}>\nBetreff: ${b.betreff}\n\n${b.text}`;
  }
  ansicht.schreiben = { art: art || 'neu', bezug: bezugId || null, an, betreff, text };
  ansicht.offen = null; ansicht.hinweis = ''; ansicht.buch = false;
  render();
  const ziel = document.getElementById(art === 'antwort' ? 'fText' : 'fAn');
  if (ziel) { ziel.focus(); if (ziel.tagName === 'TEXTAREA') ziel.setSelectionRange(0, 0); }
}

  else if (/\s/.test(w.an)) h = 'In einer E-Mail-Adresse gibt es keine Leerzeichen.';
  else if (!w.betreff || /^(AW|WG):\s*$/i.test(w.betreff)) h = 'Schreib einen Betreff: In wenigen Wörtern, worum es geht.';
  else if (!eigen({ text: w.text })) h = 'Deine E-Mail ist noch leer.';
  if (h) { ansicht.hinweis = h; render(); return; }
  const m = { id: 'g' + Date.now(), ordner: 'gesendet', von: S.adr, an: w.an.toLowerCase(), betreff: w.betreff, text: w.text.replace(/^\n+/, ''), zeit: jetzt(), gelesen: true, art: w.art, bezug: w.bezug };

  toast(`${ic('senden')} Gesendet`);

}

  let m = w.entwurf && S.mails.find(x => x.id === w.entwurf);

// ——— Anzeige ———
const ORDNER = [['eingang', 'Posteingang'], ['entwuerfe', 'Entwürfe'], ['gesendet', 'Gesendet'], ['archiv', 'Archiv'], ['papierkorb', 'Papierkorb']];

  gerendert = ansicht.schreiben;

}

document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.ordner) { merkeEntwurf(); ansicht.ordner = b.dataset.ordner; ansicht.offen = null; render(); return; }
  if (b.dataset.mail) { oeffne(b.dataset.mail); return; }
  if (b.dataset.adr) { merkeEntwurf(); const w = ansicht.schreiben; w.an = b.dataset.adr; ansicht.buch = false; render(); document.getElementById('fBetreff').focus(); return; }
  if (b.id === 'neuKnopf') { neueMail(); return; }
  if (b.id === 'los') { neueRunde(); return; }
  if (b.id === 'vonvorn') { if (confirm('Wirklich von vorn anfangen? Alle E-Mails und Aufträge werden zurückgesetzt.')) { localStorage.removeItem(KEY); location.reload(); } return; }
  const tu = b.dataset.tu; if (!tu) return;
  const id = ansicht.offen;
  if (tu === 'antworten') neueMail('antwort', id);
  else if (tu === 'weiter') neueMail('weiter', id);
  else if (tu === 'archiv') verschiebe(id, 'archiv');
  else if (tu === 'loeschen') verschiebe(id, 'papierkorb');
  else if (tu === 'zurueck') verschiebe(id, 'eingang');
  else if (tu === 'senden') senden();
  else if (tu === 'entwurf') alsEntwurf();
  else if (tu === 'verwerfen') { if (ansicht.schreiben.entwurf) { S.mails = S.mails.filter(x => x.id !== ansicht.schreiben.entwurf); speichern(); } ansicht.schreiben = null; ansicht.hinweis = ''; render(); }
  else if (tu === 'buch') { merkeEntwurf(); ansicht.buch = !ansicht.buch; render(); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && ansicht.buch) { merkeEntwurf(); ansicht.buch = false; render(); } });

      const lx = sh ? cx - breite * 0.22 : cx;
      s += `<g class="taste" data-code="${code}">
        <polygon class="seite" points="${pts([bl, brr, [brr[0], brr[1] + hoch], [bl[0], bl[1] + hoch]])}"/>
        <polygon class="kopf" points="${pts([tl, tr, brr, bl])}"/>
        ${lab ? `<text x="${lx.toFixed(1)}" y="${(sh ? cy + fs * 0.62 : cy + fs * 0.36).toFixed(1)}" font-size="${(lab.length > 2 ? fs * 0.62 : sh ? fs * 0.78 : fs).toFixed(1)}" text-anchor="middle">${esc(lab)}</text>` : ''}
        ${sh ? `<text class="klein" x="${lx.toFixed(1)}" y="${(cy - fs * 0.12).toFixed(1)}" font-size="${(fs * 0.66).toFixed(1)}" text-anchor="middle">${esc(sh)}</text>` : ''}
        ${ag ? `<text class="altgr" x="${(cx + breite * 0.28).toFixed(1)}" y="${(cy + fs * 0.62).toFixed(1)}" font-size="${(fs * 0.62).toFixed(1)}" text-anchor="middle">${esc(ag)}</text>` : ''}</g>`;
      u = ub;
    });
  });
  // Touchpad, eingelassen
  s += `<polygon points="${quad(0.365, 0.695, 0.635, 0.955)}" fill="#b9c0cc"/><polygon class="pad" id="pad" points="${quad(0.367, 0.7, 0.633, 0.95)}"/>`;
  // Aufkleber auf der Handablage
  const [ax, ay] = DP(0.15, 0.82);
  s += `<g transform="translate(${ax - 58} ${ay - 34}) rotate(-7 58 34)"><rect x="3" y="5" width="116" height="80" rx="12" fill="#000" opacity=".12" filter="url(#weich2)"/><rect width="116" height="80" rx="12" fill="#fff" stroke="#c9cfda"/><svg x="8" y="6" width="100" height="70" viewBox="0 0 80 56">${WAGEN_SVG}</svg></g>`;
  // Heftstapel und Kakaotasse vorne (vor dem Laptop)
  s += `<ellipse cx="130" cy="990" rx="140" ry="18" fill="#3b2208" opacity=".35" filter="url(#weich2)"/>` + heft(930, '#5b8def', -3) + heft(912, '#ff7a6b', 2) + heft(894, '#34c3c3', -1);
  s += `<ellipse cx="1500" cy="988" rx="80" ry="16" fill="#3b2208" opacity=".38" filter="url(#weich2)"/>
    <path d="M1552 900 q46 4 40 40 q-6 30 -44 24" stroke="#e8eef8" stroke-width="16" fill="none" stroke-linecap="round"/><path d="M1552 900 q46 4 40 40 q-6 30 -44 24" stroke="#1f2a55" stroke-opacity=".3" stroke-width="2" fill="none"/>`;
  s += zylinder('tasse', 1500, 872, 120, 110, '#ffffff', '#c9d3e3') + `<ellipse cx="1500" cy="872" rx="60" ry="20.4" fill="#7a4a2c" stroke="#1f2a55" stroke-opacity=".35" stroke-width="2"/><ellipse cx="1492" cy="868" rx="30" ry="8" fill="#9a6a44"/>
    <path d="M1486 846 q-12 -20 4 -36 q12 -14 0 -30" stroke="#fff" stroke-width="6" fill="none" opacity=".7" stroke-linecap="round"/><path d="M1516 846 q-10 -18 4 -32" stroke="#fff" stroke-width="5" fill="none" opacity=".55" stroke-linecap="round"/>
    <path d="M1478 920 l6 12 13 2 -9 9 2 13 -12 -6 -12 6 2 -13 -9 -9 13 -2z" fill="#ffc53d" stroke="#1f2a55" stroke-opacity=".4" stroke-width="2"/>`;
  document.getElementById('welt').innerHTML = s;
}
let zoom = localStorage.getItem('trappipost-zoom') === '1';
let BUEHNE = { k: 1, ox: 0, oy: 0 };
function layout() {
  const vw = innerWidth, vh = innerHeight, k = Math.min(vw / BW, vh / BH);
  BUEHNE = { k, ox: (vw - BW * k) / 2, oy: (vh - BH * k) / 2 };
  const b = document.getElementById('buehne');
  b.style.transform = `translate(${BUEHNE.ox}px, ${BUEHNE.oy}px) scale(${k})`;
  // Außerhalb der Bühne: Wand oben, Tisch unten, auf gleicher Höhe wie in der Bühne
  const kante = BUEHNE.oy + 590 * k, vorn = BUEHNE.oy + 966 * k;
  document.getElementById('szene').style.background = `linear-gradient(#cdeee0 0 ${kante}px, #dea566 ${kante}px ${vorn}px, #8f5a2c ${vorn}px)`;
  const sk = Math.min(1, SCHIRM.w / 1100, SCHIRM.h / 660);
  Object.assign(document.getElementById('app').style, { left: SCHIRM.x + 'px', top: SCHIRM.y + 'px', width: SCHIRM.w / sk + 'px', height: SCHIRM.h / sk + 'px', transform: `scale(${sk})` });
  kamera(false);
}
function kamera(animiert) {
  const k = document.getElementById('kamera');
  if (!animiert) k.style.transition = 'none';
  if (zoom) {
    const { k: s, ox, oy } = BUEHNE, vw = innerWidth, vh = innerHeight;
    const Z = Math.min((vw - 12) / (SCHIRM.w * s), (vh - 12) / (SCHIRM.h * s));
    const cx = (vw / 2 - ox) / s, cy = (vh / 2 - oy) / s;
    k.style.transform = `translate(${cx - Z * (SCHIRM.x + SCHIRM.w / 2)}px, ${cy - Z * (SCHIRM.y + SCHIRM.h / 2)}px) scale(${Z})`;
  } else k.style.transform = 'none';
  if (!animiert) { void k.offsetWidth; k.style.transition = ''; }
  const lupe = '<svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>';
  document.getElementById('zoom').innerHTML = zoom ? `${lupe}<path d="M8 11h6"/></svg> Ganzer Laptop` : `${lupe}<path d="M8 11h6M11 8v6"/></svg> Näher ran`;
}
document.addEventListener('click', (e) => { if (e.target.closest('#zoom')) { zoom = !zoom; localStorage.setItem('trappipost-zoom', zoom ? '1' : '0'); kamera(true); } });
// Tasten und Touchpad leuchten mit
function taste(code, an) { if (!code) return; document.querySelectorAll('#welt .taste').forEach(t => { if (t.dataset.code.split(' ').includes(code)) t.classList.toggle('an', an); }); }
addEventListener('keydown', (e) => taste(e.code || (e.key === 'AltGraph' ? 'AltRight' : ''), true));
addEventListener('keyup', (e) => taste(e.code || (e.key === 'AltGraph' ? 'AltRight' : ''), false));
addEventListener('blur', () => document.querySelectorAll('#welt .taste.an').forEach(t => t.classList.remove('an')));
addEventListener('pointerdown', (e) => { if (e.target.closest('#app')) { const p = document.getElementById('pad'); if (p) { p.classList.add('an'); setTimeout(() => p.classList.remove('an'), 180); } } });
addEventListener('resize', layout);

// ——— Start ———
document.getElementById('logo').innerHTML = WAGEN_SVG;
baueWelt();
layout();
S = laden();
if (S && S.mails) { render(); if (S.auftrag >= AUFTRAEGE.length && S.endlos && S.endlos.laeuft && !S.endlos.spec) starteAuftrag(); } else startDialog();
</script>
